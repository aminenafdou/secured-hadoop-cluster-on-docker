# Enable Spark History Server

# Enable event logging
spark.eventLog.enabled=true
spark.eventLog.dir=hdfs://namenode-1.hadoop/spark-logs
spark.history.fs.logDirectory=hdfs://namenode-1.hadoop/spark-logs
spark.history.ui.port=18080
spark.history.fs.cleaner.interval=1d
spark.history.fs.cleaner.maxAge=7d

# Set Kerberos principal and keytab for history server
spark.history.kerberos.enabled=true
spark.history.kerberos.principal=shs/edgenode-1.hadoop@HADOOP.LOCAL
spark.history.kerberos.keytab=/etc/security/keytabs/hadoop/shs.service.keytab
